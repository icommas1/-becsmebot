name: Railway smoke
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: railway-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run test:smoke
        env:
          SMOKE_BASE_URL: https://becsbot-production.up.railway.app
          SMOKE_ATTEMPTS: '24'
          # Research collection is intentionally paused by the owner.
          SMOKE_ARCHIVE_MODE: 'disabled'
          SMOKE_EXPECT_COMMIT: ${{ github.sha }}
