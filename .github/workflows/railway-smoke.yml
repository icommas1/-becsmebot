name: Railway smoke
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: railway-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run test:smoke
        env:
          SMOKE_BASE_URL: https://becsbot-production.up.railway.app
          SMOKE_ATTEMPTS: '24'
          # Collection stays paused pending capacity and independent backups.
          SMOKE_ARCHIVE_MODE: 'disabled'
          SMOKE_EXPECT_COMMIT: ${{ github.sha }}
          # Public hash of record #4, retrieved from production on 2026-10-04.
          SMOKE_EXPECT_RETAINED_RECORD_HASH: '3c5343e491b16da45200250015fcff77923988cb1617b16fbb5d34853f819ed2'
