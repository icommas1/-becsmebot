name: Read-only research provider probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/research/**'
      - 'scripts/probe-research.js'
      - '.github/workflows/research-probe.yml'
permissions:
  contents: read
jobs:
  keyless-readers:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check both documented free reader endpoints without credentials
        run: node scripts/probe-research.js
