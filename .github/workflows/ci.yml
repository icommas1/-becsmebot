name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    name: Node ${{ matrix.node }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: becs_test
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: becs_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U becs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://becs_test:fixture_only@localhost:5432/becs_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Restore disposable database and compare all retained evidence
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node test/fixtures/restore-data.js
          STORAGE_VERIFY_DATABASE_URL="$TEST_DATABASE_URL" node scripts/verify-storage.js > "$RUNNER_TEMP/source-verification.json"
          docker exec "$POSTGRES_CONTAINER" pg_dump -U becs_test -d becs_test --format=custom --no-owner --no-privileges > "$RUNNER_TEMP/becs-fixture.dump"
          docker exec "$POSTGRES_CONTAINER" createdb -U becs_test becs_restore
          docker exec -i "$POSTGRES_CONTAINER" pg_restore -U becs_test -d becs_restore --exit-on-error --no-owner --no-privileges < "$RUNNER_TEMP/becs-fixture.dump"
          STORAGE_VERIFY_DATABASE_URL=postgresql://becs_test:fixture_only@localhost:5432/becs_restore node scripts/verify-storage.js > "$RUNNER_TEMP/restored-verification.json"
          diff -u "$RUNNER_TEMP/source-verification.json" "$RUNNER_TEMP/restored-verification.json"
          rm "$RUNNER_TEMP/becs-fixture.dump" "$RUNNER_TEMP/source-verification.json" "$RUNNER_TEMP/restored-verification.json"
      - name: Audit production dependencies
        if: matrix.node == 22
        run: npm audit --omit=dev --audit-level=high
  browsers:
    name: Mobile and desktop browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:mobile
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
