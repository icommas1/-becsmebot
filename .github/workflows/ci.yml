name: BecsAutoForward checks

on:
  push:
    branches: [main, upgrade/forwarding-20261015]
  pull_request:
    branches: [main, upgrade/forwarding-20261015]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - name: Offline backend and security regressions
        run: python -m pytest -q
      - name: Python and browser JavaScript syntax
        run: |
          python -m compileall -q app scripts tests
          node --check static/app.js
          node --check static/sw.js

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - name: Build the independent hosted frontend with synthetic origins
        run: |
          python scripts/build_appdeploy_bundle.py --output "$RUNNER_TEMP/becs-forward-bundle" --api-url https://api.example.test/api --app-url https://app.example.test --bot-username mock_becs_bot
          npm install --prefix "$RUNNER_TEMP/becs-forward-bundle/project"
          npm run build --prefix "$RUNNER_TEMP/becs-forward-bundle/project"
      - run: python -m playwright install --with-deps chromium
      - name: Mocked mobile and desktop workflows
        run: |
          python tests/browser_bot_destination.py
          python tests/browser_compact_filters.py
          python tests/browser_users.py
          python tests/browser_backup.py
          python tests/browser_backup.py --dist "$RUNNER_TEMP/becs-forward-bundle/project/dist"
          python tests/browser_appdeploy.py --dist "$RUNNER_TEMP/becs-forward-bundle/project/dist" --screenshots preview/appdeploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mocked-browser-previews
          path: |
            compact-filters-preview.png
            preview/**/*.png
          if-no-files-found: ignore
