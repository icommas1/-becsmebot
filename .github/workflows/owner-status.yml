name: Owner-only status verification
on:
  push:
    branches: [feature/becs-owner-status]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m unittest discover -s tests -p 'test_owner_status.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check static/app.js
