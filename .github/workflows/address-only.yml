name: Contract-only forwarding tests
on:
  push:
    branches: [becs-forwarding-v1]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_address_only.py' -v
      - run: python -m compileall -q app
