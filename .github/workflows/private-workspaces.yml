name: Private workspace security and UI checks
on:
  push:
    branches: [feature/private-invites-workspaces, feature/recovery-consent-encrypted-v1, feature/disable-sensitive-recovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt playwright pytest
      - name: Offline backend and security regressions
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m pytest -q tests/test_recovery_crypto.py
          python -m compileall -q app tests
          node --check static/app.js
          node --check static/sw.js
      - name: Build the exact hosted frontend package
        run: |
          python scripts/build_appdeploy_bundle.py --output "$RUNNER_TEMP/becs-appdeploy-update"
          npm install --prefix "$RUNNER_TEMP/becs-appdeploy-update/project"
          npm run build --prefix "$RUNNER_TEMP/becs-appdeploy-update/project"
      - run: python -m playwright install --with-deps chromium
      - name: Mocked mobile and desktop browser checks
        run: |
          python tests/browser_bot_destination.py
          python tests/browser_compact_filters.py
          python tests/browser_users.py
          python tests/browser_backup.py
          python tests/browser_backup.py --dist "$RUNNER_TEMP/becs-appdeploy-update/project/dist"
          python tests/browser_appdeploy.py --dist "$RUNNER_TEMP/becs-appdeploy-update/project/dist" --screenshots preview/appdeploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-workspace-ui-previews
          path: |
            preview/private-invites/*.png
            preview/appdeploy/*.png
            preview/backups/*.png
            preview/recovery/*.png
          if-no-files-found: ignore
