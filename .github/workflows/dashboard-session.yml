name: Becs five-minute dashboard session
on:
  push:
    branches: [feature/becs-dashboard-session-5m, becs-forwarding-v1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate against verified source only
        run: |
          if test -f tools/apply_dashboard_session.py; then
            python tools/apply_dashboard_session.py
          fi
      - run: pip install -r requirements.txt playwright
      - run: python -m compileall -q app tests
      - name: Backend and regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/dashboard-session.js
          node --check static/sw.js
      - run: python -m playwright install --with-deps chromium
      - name: Mobile login, reopen, absolute expiry and logout
        run: python tests/browser_dashboard_session.py
      - name: Commit tested integration to feature branch only
        if: github.ref == 'refs/heads/feature/becs-dashboard-session-5m'
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A -- app/main.py static/app.js static/index.html static/sw.js tools/apply_dashboard_session.py
            git commit -m 'Integrate verified five-minute dashboard session'
            git push origin HEAD:feature/becs-dashboard-session-5m
          fi
          git rev-parse HEAD
