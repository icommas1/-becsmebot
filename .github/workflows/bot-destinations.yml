name: Becs bot destination regression checks
on:
  push:
    branches: [fix/becs-bot-destinations, becs-forwarding-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt playwright
      - name: Python syntax and all backend regressions
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/sw.js
      - run: python -m playwright install --with-deps chromium
      - name: Mobile bot picker and route saving with mocked API
        run: python tests/browser_bot_destination.py
